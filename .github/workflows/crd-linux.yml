name: Linux Runner RDP via Chrome Remote Desktop

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Setup RDP User
        run: |
          USERNAME=rdpadmin
          PASSWORD="GitHubRunner2026SecurePass"
          if id "$USERNAME" &>/dev/null; then
            sudo userdel -r "$USERNAME" || true
          fi
          sudo useradd -m -s /bin/bash "$USERNAME"
          echo "$USERNAME:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo "$USERNAME"
          echo "$USERNAME ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/rdpadmin > /dev/null
          sudo chmod 440 /etc/sudoers.d/rdpadmin

      - name: Install Desktop and Chrome Remote Desktop
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies dbus-x11
          wget -q https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb -O "$RUNNER_TEMP/crd.deb"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "$RUNNER_TEMP/crd.deb"
          sudo groupadd -f chrome-remote-desktop
          sudo usermod -aG chrome-remote-desktop rdpadmin

          RDP_UID=$(id -u rdpadmin)
          sudo mkdir -p "/run/user/$RDP_UID"
          sudo chown rdpadmin:rdpadmin "/run/user/$RDP_UID"
          sudo chmod 700 "/run/user/$RDP_UID"

          cat <<'EOF' | sudo tee /home/rdpadmin/.chrome-remote-desktop-session > /dev/null
          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export XDG_CONFIG_DIRS=/etc/xdg
          export XDG_DATA_DIRS=/usr/local/share:/usr/share
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          exec dbus-run-session -- /usr/bin/xfce4-session
          EOF
          sudo chown rdpadmin:rdpadmin /home/rdpadmin/.chrome-remote-desktop-session

      - name: Start Chrome Remote Desktop Host
        run: |
          CRD_CODE="4/0AUn6Hd90lEy4aU27TWPYtUGNCtzhUeHxgj7ORZpkSILXmco0ur7Ju04hnE9ha5T6QVHFFQ"
          CRD_PIN="123456"
          sudo -u rdpadmin -H env XDG_RUNTIME_DIR="/run/user/$(id -u rdpadmin)" bash -c '
            /opt/google/chrome-remote-desktop/start-host \
              --code="'"$CRD_CODE"'" \
              --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
              --name="$(hostname)" \
              --pin="'"$CRD_PIN"'"
          '
          echo "------------------------------------------"
          echo "Chrome Remote Desktop 起動試行中..."
          echo "設定したPINコード: $CRD_PIN"
          echo "------------------------------------------"

      - name: Keep Alive
        run: sleep 21000
